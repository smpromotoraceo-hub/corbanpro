<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CorbanPRO — CRM Correspondente Bancário</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:#f8fafc;}
    input,select,textarea,button{font-family:inherit;}
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:#f1f5f9;}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}
    option{color:#1e293b;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef}=React;

const PRODUCTS=["FGTS / Saque-Aniversário","Crédito CLT","Servidor Federal / SIAPE","Consignado INSS","Refinanciamento","Cartão Benefício"];
const BANKS=["Caixa","BMG","Itaú Consignado","Bradesco","Safra","Pan","C6 Consig","Banco do Brasil","Santander","Outro"];
const CONSULTANTS=["Beatriz","Consultor 2","Consultor 3","Consultor 4","Consultor 5"];
const ORIGINS=["Instagram","Facebook","WhatsApp","Indicação","Google","TikTok","Tráfego Pago","Lista Fria","Ligação Ativa","Portabilidade","Cliente Antigo","Site","Outro"];
const FUNNEL=[
  {id:"novo_lead",label:"Novo Lead",color:"#64748b"},
  {id:"qualificacao",label:"Qualificação",color:"#3b82f6"},
  {id:"aguardando_autorizacao",label:"Aguard. Autorização",color:"#f59e0b"},
  {id:"autorizado",label:"Autorizado",color:"#8b5cf6"},
  {id:"consulta_realizada",label:"Consulta Realizada",color:"#06b6d4"},
  {id:"proposta_enviada",label:"Proposta Enviada",color:"#f97316"},
  {id:"aguardando_docs",label:"Aguard. Documentos",color:"#eab308"},
  {id:"digitacao",label:"Em Digitação",color:"#6366f1"},
  {id:"aguardando_banco",label:"Aguard. Banco",color:"#a855f7"},
  {id:"aprovado_assinatura",label:"Aprovado/Assinatura",color:"#10b981"},
  {id:"pago",label:"Pago/Fechado",color:"#059669"},
  {id:"retorno_futuro",label:"Retorno Futuro",color:"#0ea5e9"},
  {id:"bloqueado",label:"Bloqueado",color:"#94a3b8"},
  {id:"perdido",label:"Perdido",color:"#ef4444"},
];
const TAGS=[
  {id:"vendas",label:"VENDAS",color:"#10b981"},
  {id:"operacional",label:"OPERACIONAL",color:"#3b82f6"},
  {id:"resgate",label:"RESGATE",color:"#8b5cf6"},
  {id:"faltaretorno",label:"FALTA RETORNO",color:"#f59e0b"},
  {id:"aguardandopagamento",label:"AGUARD. PAGAMENTO",color:"#f97316"},
  {id:"seminteresse",label:"SEM INTERESSE",color:"#ef4444"},
];
const LOSS_REASONS=["Cliente não respondeu","Valor baixo","Taxa não agradou","Sem saldo FGTS","Sem margem CLT","Não autorizou banco","Não enviou documentos","Banco recusou","Fechou com concorrente","Fora do perfil","Outro"];
const DEFAULT_MSGS=[
  {id:1,category:"Abordagem",label:"Primeiro Atendimento",text:"Oi, tudo bem? 😊 Aqui é da CorbanPRO! Me confirma qual crédito você quer consultar hoje: FGTS, CLT ou servidor?"},
  {id:2,category:"Abordagem",label:"Reativação",text:"Oi! 😊 Aqui é a CorbanPRO. Você fez uma simulação conosco e pode ter uma nova oportunidade. Posso verificar?"},
  {id:3,category:"Operacional",label:"Pedido de Autorização",text:"Para consultar com segurança, preciso que você autorize os bancos no aplicativo. Assim que autorizar, me avise! 👍"},
  {id:4,category:"Operacional",label:"Pedido de Documentos",text:"Ótimo! Para avançar preciso de: RG ou CNH, comprovante de residência e renda. Pode enviar por aqui? 📎"},
  {id:5,category:"Operacional",label:"Cliente Parado",text:"Oi! 👋 Passando para ver se você ainda tem interesse na simulação. Posso reconsultar para você?"},
  {id:6,category:"Fechamento",label:"Proposta Aprovada",text:"🎉 Sua proposta foi aprovada! Agora preciso que você assine o contrato. Vou te passar os detalhes!"},
  {id:7,category:"Fechamento",label:"Pós-Venda",text:"Contrato finalizado! ✅ Qualquer dúvida, fico à disposição. Obrigada pela confiança! 🙏"},
  {id:8,category:"Reconsulta",label:"Nova Margem Disponível",text:"Oi {nome}! 🎉 Sua margem foi atualizada e você pode ter um novo crédito disponível. Posso verificar agora?"},
  {id:9,category:"Simulação",label:"Enviar Simulação",text:"Olá {nome}! Fiz uma simulação:\n\n💰 Valor: R$ {valor}\n📅 Prazo: {prazo} meses\n💳 Parcela: R$ {parcela}\n🏦 Banco: {banco}\n\nDinheiro em até 2 dias úteis! Prosseguir? 😊"},
];
const CHECKLIST_ITEMS=["Cliente autorizou consulta?","Explicação clara fornecida?","Cliente confirmou interesse?","Dados conferidos?","Documento legível?","Proposta sem promessa falsa?","Contrato assinado pelo cliente?","Comprovante salvo?","Atendimento respeitou política?"];
const BANK_RATES={"Caixa":{min:1.49,prazo:96},"BMG":{min:1.65,prazo:84},"Itaú Consignado":{min:1.55,prazo:96},"Bradesco":{min:1.60,prazo:84},"Safra":{min:1.70,prazo:72},"Pan":{min:1.75,prazo:84},"C6 Consig":{min:1.58,prazo:96},"Banco do Brasil":{min:1.45,prazo:96},"Santander":{min:1.62,prazo:84}};
const OC={"Instagram":"#e1306c","Facebook":"#1877f2","WhatsApp":"#25d366","Indicação":"#f59e0b","Google":"#ea4335","TikTok":"#010101","Tráfego Pago":"#6366f1","Lista Fria":"#64748b","Ligação Ativa":"#8b5cf6","Portabilidade":"#0ea5e9","Cliente Antigo":"#f97316","Site":"#10b981","Outro":"#94a3b8"};

function useStorage(k,d){const[v,sv]=useState(()=>{try{const s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch{return d;}});useEffect(()=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},[k,v]);return[v,sv];}
function tAgo(ts){if(!ts)return"";const d=Math.floor((Date.now()-ts)/1000);if(d<60)return d+"s";if(d<3600)return Math.floor(d/60)+"min";if(d<86400)return Math.floor(d/3600)+"h";return Math.floor(d/86400)+"d";}
const fC=(id)=>FUNNEL.find(f=>f.id===id)?.color||"#64748b";
const fL=(id)=>FUNNEL.find(f=>f.id===id)?.label||id;
const tC=(id)=>TAGS.find(t=>t.id===id)?.color||"#64748b";
const tLb=(id)=>TAGS.find(t=>t.id===id)?.label||id;
const pmt=(pv,r,n)=>r?pv*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):pv/n;
const score=(c)=>{const m=(c.messages||[]).filter(x=>x.from==="in").length;const hm=parseFloat(c.margin||0)>0;const rc=c.lastMsgTs&&Date.now()-c.lastMsgTs<172800000;if(rc&&hm&&m>2)return"hot";if(m>0&&hm)return"warm";return"cold";};
const SC={hot:{label:"🔥 Quente",color:"#ef4444"},warm:{label:"🟡 Morno",color:"#f59e0b"},cold:{label:"🔵 Frio",color:"#3b82f6"}};

function App(){
  const[contacts,setContacts]=useStorage("cp_c",[]);
  const[commissions,setCommissions]=useStorage("cp_cm",[]);
  const[gAgenda,setGAgenda]=useStorage("cp_ga",[]);
  const[creds,setCreds]=useStorage("cp_cr",[]);
  const[zapi,setZapi]=useStorage("cp_z",{instanceId:"",token:"",phone:"",connected:false});
  const[zapiLogs,setZapiLogs]=useStorage("cp_zl",[]);
  const[qMsgs,setQMsgs]=useStorage("cp_qm",DEFAULT_MSGS);
  const[campaigns,setCampaigns]=useStorage("cp_camp",[]);
  const[scheduled,setScheduled]=useStorage("cp_sch",[]);
  const[teamChat,setTeamChat]=useStorage("cp_tc",[]);
  const[flows,setFlows]=useStorage("cp_fl",[{id:1,name:"Fluxo Principal",nodes:[{id:"s1",type:"start",text:"Olá! 👋 Bem-vindo à CorbanPRO!\n\n1️⃣ FGTS\n2️⃣ Crédito CLT\n3️⃣ Servidor Federal\n4️⃣ Falar com consultor"},{id:"s2",type:"message",text:"Ótimo! Para consultar preciso do seu CPF. Pode informar?"},{id:"s3",type:"human",text:"Transferindo para um consultor... ⏳"}]}]);
  const[consultant,setConsultant]=useStorage("cp_cons","Beatriz");
  const[screen,setScreen]=useState("chat");
  const[ac,setAc]=useState(null);
  const[cTab,setCTab]=useState("atendimentos");
  const[srch,setSrch]=useState("");
  const[msgIn,setMsgIn]=useState("");
  const[showNC,setShowNC]=useState(false);
  const[showQM,setShowQM]=useState(false);
  const[showTM,setShowTM]=useState(false);
  const[showTr,setShowTr]=useState(false);
  const[showAI,setShowAI]=useState(false);
  const[showNt,setShowNt]=useState(false);
  const[showCk,setShowCk]=useState(false);
  const[showSim,setShowSim]=useState(false);
  const[aiLoad,setAiLoad]=useState(false);
  const[aiResp,setAiResp]=useState("");
  const[stab,setStab]=useState("detalhes");
  const[lossM,setLossM]=useState(null);
  const[lossR,setLossR]=useState("");
  const[tMsg,setTMsg]=useState("");
  const[simR,setSimR]=useState(null);
  const[simF,setSimF]=useState({value:"5000",product:PRODUCTS[0]});
  const[higR,setHigR]=useState(null);
  const[higL,setHigL]=useState(false);
  const[selHig,setSelHig]=useState([]);
  const[rFilt,setRFilt]=useState("month");
  const[showCF,setShowCF]=useState(false);
  const[campF,setCampF]=useState({name:"",message:"",filter:"all",scheduledAt:""});
  const[showSF,setShowSF]=useState(false);
  const[schedF,setSchedF]=useState({contactId:"",message:"",scheduledAt:"",type:"Lembrete"});
  const[notifs,setNotifs]=useState([]);
  const[showNf,setShowNf]=useState(false);
  const[aFlow,setAFlow]=useState(null);
  const[newNode,setNewNode]=useState({type:"message",text:""});
  const[salary,setSalary]=useState("");
  const[pct,setPct]=useState("35");
  const eC={name:"",phone:"",cpf:"",email:"",city:"",product:PRODUCTS[0],origin:"WhatsApp",status:"novo_lead",tags:[],consultant,notes:"",salary:"",margin:"",preApproved:"",released:"",returnDate:"",bank:"",messages:[],proposals:[],agendaItems:[],checklist:{},docs:[]};
  const[cf,setCf]=useState(eC);
  const msgEnd=useRef(null);const tcEnd=useRef(null);
  const today=new Date().toISOString().split("T")[0];

  useEffect(()=>{msgEnd.current?.scrollIntoView({behavior:"smooth"});},[ac?.messages]);
  useEffect(()=>{tcEnd.current?.scrollIntoView({behavior:"smooth"});},[teamChat]);

  const saveC=()=>{
    if(!cf.name||!cf.phone)return alert("Nome e telefone obrigatórios");
    const nc={...cf,id:Date.now(),createdAt:Date.now(),lastMsgTs:Date.now(),messages:[{id:Date.now(),from:"system",text:"Contato criado por "+consultant,ts:Date.now()}]};
    setContacts(p=>[nc,...p]);setAc(nc);setCf(eC);setShowNC(false);
  };

  const upC=(field,value)=>{
    if(!ac)return;
    const u={...ac,[field]:value};
    setContacts(p=>p.map(c=>c.id===ac.id?u:c));setAc(u);
  };

  const sendMsg=(text,type="out")=>{
    if(!text?.trim()||!ac)return;
    const msg={id:Date.now(),from:type,text:text.trim(),ts:Date.now(),consultant};
    const u={...ac,messages:[...(ac.messages||[]),msg],lastMsg:text.trim(),lastMsgTs:Date.now()};
    setContacts(p=>p.map(c=>c.id===ac.id?u:c));setAc(u);setMsgIn("");
  };

  const togTag=(id)=>{const t=ac?.tags||[];upC("tags",t.includes(id)?t.filter(x=>x!==id):[...t,id]);setShowTM(false);};

  const encerrar=()=>{if(!confirm("Encerrar?"))return;upC("status","retorno_futuro");sendMsg("Atendimento encerrado.","system");};

  const upPS=(pid,st)=>{
    if(st==="perdido"){setLossM(pid);return;}
    upC("proposals",(ac.proposals||[]).map(p=>p.id===pid?{...p,status:st}:p));
  };

  const confLoss=()=>{
    if(!lossR)return alert("Selecione o motivo");
    upC("proposals",(ac.proposals||[]).map(p=>p.id===lossM?{...p,status:"perdido",lossReason:lossR}:p));
    setLossM(null);setLossR("");
  };

  const runSim=()=>{
    const val=parseFloat(simF.value)||5000;
    const res=Object.entries(BANK_RATES).map(([bank,r])=>{const rate=r.min/100;const parc=pmt(val,rate,r.prazo);return{bank,rate:r.min,prazo:r.prazo,parc,total:parc*r.prazo};}).sort((a,b)=>a.rate-b.rate);
    setSimR({val,res});
  };

  const useSimRes=(r)=>{
    const msg=`Olá ${ac?.name?.split(" ")[0]||""}! Fiz uma simulação:\n\n💰 Valor: R$ ${parseFloat(simF.value).toLocaleString("pt-BR",{minimumFractionDigits:2})}\n📅 Prazo: ${r.prazo}x\n💳 Parcela: R$ ${r.parc.toLocaleString("pt-BR",{minimumFractionDigits:2})}\n🏦 Banco: ${r.bank}\n📊 Taxa: ${r.rate}% a.m.\n\nDinheiro em até 2 dias úteis! Prosseguir? 😊`;
    setMsgIn(msg);setShowSim(false);setSimR(null);
  };

  const runRecon=async()=>{
    if(!ac)return;sendMsg("🔄 Reconsulta iniciada...","system");
    await new Promise(r=>setTimeout(r,2000));
    const has=Math.random()>0.3;const val=(Math.random()*8000+1000).toFixed(2);
    if(has){upC("preApproved",val);upC("status","consulta_realizada");sendMsg(`✅ Reconsulta: nova margem de R$ ${parseFloat(val).toLocaleString("pt-BR",{minimumFractionDigits:2})} disponível!`,"system");}
    else sendMsg("❌ Reconsulta: sem nova margem no momento.","system");
  };

  const runHig=async(ids)=>{
    setHigL(true);await new Promise(r=>setTimeout(r,2000));
    const res=ids.map(id=>{const c=contacts.find(x=>x.id===id);const has=Math.random()>0.4;const val=has?(Math.random()*8000+500).toFixed(2):0;return{id,name:c?.name,phone:c?.phone,product:c?.product,has,val:parseFloat(val),status:has?"✅ Disponível":"❌ Sem saldo"};});
    setHigR(res);setHigL(false);
    res.filter(r=>r.has).forEach(r=>setContacts(p=>p.map(c=>c.id===r.id?{...c,preApproved:r.val,status:"consulta_realizada"}:c)));
  };

  const callAI=async(mode)=>{
    setAiLoad(true);setAiResp("");
    const lm=(ac?.messages||[]).filter(m=>m.from==="in").slice(-3).map(m=>m.text).join("\n");
    let p="";
    if(mode==="resposta")p=`Você é consultora de crédito da CorbanPRO. O cliente ${ac?.name} enviou: "${lm}". Produto: ${ac?.product}. Crie uma resposta profissional e empática. Máximo 80 palavras.`;
    else if(mode==="abordagem")p=`Crie uma mensagem de abordagem inicial para o produto ${ac?.product} para o cliente ${ac?.name}. Seja direto, empático e use emojis com moderação. Máximo 100 palavras.`;
    else if(mode==="objecao")p=`Especialista em vendas de crédito. O cliente disse: "${lm}". Crie resposta de contorno de objeção empática. Produto: ${ac?.product}. Máximo 100 palavras.`;
    else if(mode==="resumo")p=`Resumo executivo: ${ac?.name}, Produto: ${ac?.product}, Salário: R$ ${ac?.salary}, Margem: R$ ${ac?.margin}, Status: ${fL(ac?.status)}, Score: ${SC[score(ac)]?.label}. Destaque oportunidades. Máximo 100 palavras.`;
    else if(mode==="fluxo")p=`Crie um fluxo de atendimento WhatsApp para correspondente bancário com FGTS, CLT e SIAPE. Liste os nós: boas-vindas, qualificação, coleta de dados e transferência. Formato de tópicos. Máximo 150 palavras.`;
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:p}]})});
      const data=await res.json();setAiResp(data.content?.[0]?.text||"Erro.");
    }catch{setAiResp("Erro de conexão.");}
    setAiLoad(false);
  };

  const chkZapi=async()=>{
    if(!zapi.instanceId||!zapi.token)return alert("Preencha Instance ID e Token");
    try{const res=await fetch(`https://api.z-api.io/instances/${zapi.instanceId}/token/${zapi.token}/status`);const d=await res.json();setZapi(p=>({...p,connected:!!d.connected}));setZapiLogs(l=>[{ts:Date.now(),msg:d.connected?"✅ Conectado!":"❌ Não conectado."},...l.slice(0,49)]);}
    catch(e){setZapiLogs(l=>[{ts:Date.now(),msg:"⚠️ Erro: "+e.message},...l.slice(0,49)]);}
  };

  const sendZ=async(phone,msg)=>{
    if(!zapi.connected)return false;
    try{await fetch(`https://api.z-api.io/instances/${zapi.instanceId}/token/${zapi.token}/send-text`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:phone.replace(/\D/g,""),message:msg})});setZapiLogs(l=>[{ts:Date.now(),msg:"📤 Enviado para "+phone},...l.slice(0,49)]);return true;}catch{return false;}
  };

  const openWA=(c,msg="")=>{
    const t={"FGTS / Saque-Aniversário":n=>`Olá ${n}! 👋 Pode antecipar seu *FGTS* hoje! Me manda seu CPF! 🚀`,"Crédito CLT":n=>`Olá ${n}! 😊 Crédito pelo *CLT* a partir de 1,8% a.m. Quer simular? 👇`,"Servidor Federal / SIAPE":n=>`Olá ${n}! *SIAPE* com melhores taxas! 1,5% a.m. Vamos simular? 😊`};
    const fn=t[c.product]||(n=>`Olá ${n}! Aqui é a CorbanPRO. Posso te ajudar? 😊`);
    const m=msg||fn(c.name?.split(" ")[0]||"");
    if(zapi.connected)sendZ(c.phone,m);else window.open(`https://wa.me/55${c.phone?.replace(/\D/g,"")}?text=${encodeURIComponent(m)}`,"_blank");
  };

  const saveCamp=()=>{
    if(!campF.name||!campF.message)return alert("Preencha nome e mensagem");
    const fil=campF.filter==="all"?contacts:contacts.filter(c=>c.product===campF.filter||c.status===campF.filter);
    setCampaigns(p=>[...p,{...campF,id:Date.now(),status:"rascunho",total:fil.length,sent:0,createdAt:new Date().toLocaleDateString("pt-BR")}]);
    setCampF({name:"",message:"",filter:"all",scheduledAt:""});setShowCF(false);
  };

  const sendCamp=async(camp)=>{
    if(!confirm(`Enviar para ${camp.total} clientes?`))return;
    setCampaigns(p=>p.map(c=>c.id===camp.id?{...c,status:"enviando"}:c));
    const fil=camp.filter==="all"?contacts:contacts.filter(c=>c.product===camp.filter||c.status===camp.filter);
    for(let i=0;i<fil.length;i++){
      const c=fil[i];const m=camp.message.replace("{nome}",c.name?.split(" ")[0]||"").replace("{produto}",c.product||"");
      await sendZ(c.phone,m);setCampaigns(p=>p.map(x=>x.id===camp.id?{...x,sent:i+1}:x));
      await new Promise(r=>setTimeout(r,2000));
    }
    setCampaigns(p=>p.map(c=>c.id===camp.id?{...c,status:"concluída"}:c));
  };

  const filPeriod=(items,field="createdAt")=>{const now=Date.now();const per={day:86400000,week:604800000,month:2592000000,year:31536000000};return items.filter(i=>now-(i[field]||0)<(per[rFilt]||per.month));};

  const exportCSV=()=>{
    const rows=[["Nome","Telefone","CPF","Produto","Status","Origem","Consultor","Criado em","Último contato","Pré-aprovado"],...contacts.map(c=>[c.name,c.phone,c.cpf,c.product,fL(c.status),c.origin,c.consultant,c.createdAt?new Date(c.createdAt).toLocaleDateString("pt-BR"):"",c.lastMsgTs?new Date(c.lastMsgTs).toLocaleDateString("pt-BR"):"",c.preApproved||""])];
    const csv=rows.map(r=>r.map(v=>`"${(v||"").toString().replace(/"/g,'""')}"`).join(";")).join("\n");
    const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="corbanpro_"+rFilt+".csv";a.click();URL.revokeObjectURL(url);
  };

  const allP=contacts.flatMap(c=>(c.proposals||[]).map(p=>({...p,clientName:c.name,clientId:c.id})));
  const totComm=commissions.reduce((s,c)=>s+(parseFloat(c.received)||0),0);
  const pendComm=commissions.filter(c=>c.status==="Pendente").reduce((s,c)=>s+(parseFloat(c.expected)||0),0);
  const totRel=allP.filter(p=>p.status==="pago").reduce((s,p)=>s+(parseFloat(p.value)||0),0);
  const hotL=contacts.filter(c=>score(c)==="hot");
  const todayAg=gAgenda.filter(a=>a.date===today&&!a.done);
  const filC=contacts.filter(c=>{
    const ms=c.name?.toLowerCase().includes(srch.toLowerCase())||c.phone?.includes(srch)||(c.tags||[]).some(t=>tLb(t).toLowerCase().includes(srch.toLowerCase()));
    const mt=cTab==="esperando"?c.status==="novo_lead":cTab==="automatico"?false:true;
    return ms&&mt;
  });

  const S={
    i:{width:"100%",border:"1px solid #e2e8f0",borderRadius:8,padding:"7px 10px",fontSize:13,outline:"none",boxSizing:"border-box",background:"white",fontFamily:"inherit"},
    b:(bg,c="#fff",p="7px 12px")=>({background:bg,color:c,border:"none",borderRadius:8,padding:p,fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}),
    cd:{background:"white",borderRadius:12,padding:14,boxShadow:"0 1px 4px rgba(0,0,0,0.06)",border:"1px solid #f1f5f9"},
    l:{fontSize:11,color:"#94a3b8",marginBottom:3,display:"block"},
  };

            <div style={{position:"relative"}}>

                      <div style={{fontWeight:600,fontSize:12,color:"#1e293b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</div>
                      <div style={{fontSize:10,color:"#94a3b8",flexShrink:0}}>{tAgo(c.lastMsgTs||c.createdAt)}</div>
                    </div>

                  <button onClick={()=>navigator.clipboard.writeText(aiResp)} style={S.b("#f1f5f9","#374151","4px 8px")}>📋 Copiar</button>

                <div><span style={S.l}>Produto</span><select value={simF.product} onChange={e=>setSimF(p=>({...p,product:e.target.value}))} style={{...S.i,width:160,fontSize:12}}>{PRODUCTS.map(x=><option key={x}>{x}</option>)}</select></div>

              </div>
              {simR&&<div style={{maxHeight:160,overflowY:"auto"}}>
                {simR.res.map((r,i)=>(
                  <div key={r.bank} style={{display:"flex",alignItems:"center",gap:7,padding:"3px 0",borderBottom:"1px solid #dcfce7",fontSize:11}}>

                    <span style={{color:"#3b82f6"}}>{r.rate}%</span>
                    <span style={{fontWeight:700,color:"#059669"}}>{r.prazo}x R$ {r.parc.toLocaleString("pt-BR",{minimumFractionDigits:2})}</span>
                    <button onClick={()=>useSimRes(r)} style={S.b("#3b82f6","#fff","2px 6px")}>Usar</button>

              <textarea value={ac.notes||""} onChange={e=>upC("notes",e.target.value)} style={{...S.i,height:48,resize:"none",fontSize:11}} placeholder="Anotações..."/>

            {showCk&&<div style={{background:"#f0fdf4",padding:"7px 13px",borderBottom:"1px solid #86efac"}}>
              <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>☑ Checklist ({CHECKLIST_ITEMS.filter(i=>(ac.checklist||{})[i]).length}/{CHECKLIST_ITEMS.length})</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:3}}>
                {CHECKLIST_ITEMS.map(item=>(
                  <label key={item} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,cursor:"pointer"}}>
                    <input type="checkbox" checked={!!(ac.checklist||{})[item]} onChange={e=>upC("checklist",{...(ac.checklist||{}),[item]:e.target.checked})} style={{width:11,height:11}}/>
                    <span style={{color:(ac.checklist||{})[item]?"#10b981":"#374151"}}>{item}</span>

              <span style={{fontSize:11,fontWeight:600}}>Transferir:</span>
              {CONSULTANTS.map(c=><button key={c} onClick={()=>{upC("consultant",c);sendMsg("Transferido para "+c,"system");setShowTr(false);}} style={S.b(ac.consultant===c?"#3b82f6":"#f1f5f9",ac.consultant===c?"white":"#374151","4px 8px")}>{c}</button>)}
            </div>}

            <div style={{flex:1,overflowY:"auto",padding:11,background:"#e5ddd5",display:"flex",flexDirection:"column",gap:7}}>

                    <div style={{maxWidth:"72%",background:msg.from==="out"?"#dcf8c6":"white",borderRadius:msg.from==="out"?"10px 0 10px 10px":"0 10px 10px 10px",padding:"7px 10px",boxShadow:"0 1px 2px rgba(0,0,0,0.1)"}}>
                      {msg.from==="in"&&<div style={{fontSize:9,color:"#25d366",fontWeight:700,marginBottom:1}}>{ac.name?.split(" ")[0]}</div>}
                      {msg.from==="out"&&<div style={{fontSize:9,color:"#3b82f6",fontWeight:700,marginBottom:1}}>👤 {msg.consultant}</div>}
                      <div style={{fontSize:12,lineHeight:1.5,whiteSpace:"pre-wrap"}}>{msg.text}</div>
                      <div style={{fontSize:9,color:"#94a3b8",textAlign:"right",marginTop:2}}>{new Date(msg.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</div>
                    </div>
                  )}
                </div>
              ))}
              {(ac.messages||[]).length===0&&<div style={{textAlign:"center",color:"#94a3b8",marginTop:30,fontSize:12}}>Nenhuma mensagem.</div>}
              <div ref={msgEnd}/>
            </div>

            <div style={{background:"white",padding:"8px 11px",borderTop:"1px solid #e2e8f0"}}>
              <div style={{display:"flex",gap:5,marginBottom:6,flexWrap:"wrap"}}>
                <button onClick={()=>setShowQM(!showQM)} style={S.b("#f1f5f9","#374151","4px 7px")}>⚡ Respostas</button>
                <button onClick={()=>{const m=prompt("Simular msg do cliente:");if(m)sendMsg(m,"in");}} style={S.b("#f1f5f9","#374151","4px 7px")}>📥 Simular</button>
                <button onClick={()=>{setShowSF(true);setSchedF(p=>({...p,contactId:String(ac.id)}));}} style={S.b("#f1f5f9","#374151","4px 7px")}>📅 Agendar</button>
                <button onClick={()=>openWA(ac,msgIn)} style={S.b("#25d366","#fff","4px 7px")}>📱 {zapi.connected?"Enviar WA":"Abrir WA"}</button>
              </div>
              {showQM&&<div style={{background:"#f8fafc",borderRadius:8,padding:6,marginBottom:6,maxHeight:130,overflowY:"auto",display:"flex",flexDirection:"column",gap:3}}>
                {["Abordagem","Operacional","Fechamento","Reconsulta","Simulação"].map(cat=>{
                  const msgs=qMsgs.filter(m=>m.category===cat);if(!msgs.length)return null;
                  return<div key={cat}><div style={{fontSize:9,color:"#94a3b8",fontWeight:700,padding:"2px 0"}}>{cat}</div>
                    {msgs.map(m=><button key={m.id} onClick={()=>{setMsgIn(m.text.replace("{nome}",ac.name?.split(" ")[0]||""));setShowQM(false);}} style={{textAlign:"left",background:"white",border:"1px solid #e2e8f0",borderRadius:6,padding:"3px 7px",cursor:"pointer",fontSize:11,width:"100%",marginBottom:2}}>
                      <span style={{fontWeight:600,color:"#3b82f6"}}>⚡ {m.label}</span>
                      <div style={{color:"#64748b",fontSize:10,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.text}</div>
                    </button>)}
                  </div>;
                })}
              </div>}
              <div style={{display:"flex",gap:7}}>
                <textarea value={msgIn} onChange={e=>setMsgIn(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg(msgIn);}}} placeholder="Digite... (Enter=enviar)" style={{...S.i,flex:1,height:50,resize:"none",fontSize:12}}/>
                <button onClick={()=>sendMsg(msgIn)} style={{...S.b("#25d366","#fff","7px 12px"),fontSize:16,height:50}}>➤</button>
              </div>
            </div>
          </div>
        )}

        {ac&&<div style={{width:255,background:"white",borderLeft:"1px solid #e2e8f0",display:"flex",flexDirection:"column",flexShrink:0,overflowY:"auto"}}>
          <div style={{display:"flex",borderBottom:"1px solid #f1f5f9"}}>
            {[["detalhes","Detalhes"],["propostas","Propostas"],["docs","Docs"],["agenda","Agenda"]].map(([id,label])=>(
              <button key={id} onClick={()=>setStab(id)} style={{flex:1,padding:"7px 2px",border:"none",background:"none",cursor:"pointer",fontSize:10,fontWeight:stab===id?700:400,color:stab===id?"#3b82f6":"#64748b",borderBottom:stab===id?"2px solid #3b82f6":"2px solid transparent"}}>{label}</button>
            ))}

          {stab==="detalhes"&&<div style={{padding:10,display:"flex",flexDirection:"column",gap:7}}>

              <div style={{width:44,height:44,borderRadius:"50%",background:fC(ac.status),display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800,fontSize:17,margin:"0 auto 5px"}}>{ac.name?.[0]?.toUpperCase()}</div>

              </div>
            </div>
            {[["Nome","name","text"],["Telefone","phone","text"],["CPF","cpf","text"],["E-mail","email","email"],["Cidade","city","text"],["Salário (R$)","salary","number"],["Margem (R$)","margin","number"],["Pré-aprovado","preApproved","number"],["Liberado","released","number"],["Retorno","returnDate","date"]].map(([label,field,type])=>(
              <div key={field}><span style={S.l}>{label}</span><input type={type} value={ac[field]||""} onChange={e=>upC(field,e.target.value)} style={{...S.i,fontSize:11,padding:"4px 6px"}}/></div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(190px,1fr))",gap:9,marginBottom:10}}>
            <div><span style={S.l}>Instance ID</span><input value={zapi.instanceId} onChange={e=>setZapi(p=>({...p,instanceId:e.target.value}))} style={S.i} placeholder="3F4F61ED3B4D..."/></div>
            <div><span style={S.l}>Token</span><input type="password" value={zapi.token} onChange={e=>setZapi(p=>({...p,token:e.target.value}))} style={S.i} placeholder="34EEA63A11C8..."/></div>
            <div><span style={S.l}>Seu número (com DDD)</span><input value={zapi.phone} onChange={e=>setZapi(p=>({...p,phone:e.target.value}))} style={S.i} placeholder="48999998888"/></div>
          </div>
          <div style={{display:"flex",gap:7}}>
            <button onClick={chkZapi} style={S.b("#2563eb")}>🔍 Verificar</button>
            <button onClick={()=>sendZ(zapi.phone,"✅ Teste CorbanPRO!")} disabled={!zapi.connected} style={S.b(zapi.connected?"#10b981":"#94a3b8")}>📤 Testar</button>
            <button onClick={()=>setZapi(p=>({...p,connected:false}))} style={S.b("#f1f5f9","#64748b")}>Desconectar</button>
          </div>
        </div>
        <div style={S.cd}>
          <div style={{fontWeight:700,marginBottom:7}}>📋 Log</div>
          <div style={{maxHeight:170,overflowY:"auto",display:"flex",flexDirection:"column",gap:3}}>
            {zapiLogs.length===0&&<div style={{color:"#94a3b8",fontSize:11,textAlign:"center",padding:14}}>Sem atividades.</div>}
            {zapiLogs.map((l,i)=><div key={i} style={{fontSize:10,padding:"3px 6px",background:"#f8fafc",borderRadius:4,display:"flex",gap:7}}><span style={{color:"#94a3b8"}}>{new Date(l.ts).toLocaleTimeString("pt-BR")}</span><span>{l.msg}</span></div>)}
          </div>
        </div>
      </div>}

      {/* BANCOS */}
      {screen==="bancos"&&<div style={{flex:1,overflowY:"auto",padding:16}}>
        <div style={{fontWeight:800,fontSize:18,marginBottom:14,color:"#1e293b"}}>🔐 Credenciais Bancárias</div>
        <div style={{background:"#fef3c7",border:"1px solid #fcd34d",borderRadius:9,padding:10,marginBottom:12,fontSize:11,color:"#92400e"}}>🔐 Credenciais salvas apenas no navegador. Não compartilhe este dispositivo sem limpar os dados.</div>
        <button onClick={()=>{const bank=prompt("Banco:");const login=prompt("Login:");const password=prompt("Senha:");const notes=prompt("Observações:");if(bank&&login)setCreds(p=>[...p,{id:Date.now(),bank,login,password,notes}]);}} style={{...S.b("#2563eb","#fff","7px 12px"),marginBottom:10}}>+ Adicionar Banco</button>
        <div style={{display:"grid",gap:7}}>
          {creds.map(c=>(
            <div key={c.id} style={{...S.cd,display:"flex",alignItems:"center",gap:9,padding:11}}>
              <div style={{width:38,height:38,borderRadius:8,background:"#1e40af",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800,fontSize:11,flexShrink:0}}>{c.bank?.slice(0,3).toUpperCase()}</div>
              <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{c.bank}</div><div style={{fontSize:11,color:"#64748b"}}>Login: {c.login}</div>{c.notes&&<div style={{fontSize:10,color:"#94a3b8"}}>{c.notes}</div>}</div>
              <span style={{background:"#dcfce7",color:"#16a34a",borderRadius:5,padding:"2px 7px",fontSize:10,fontWeight:600}}>✅ Config.</span>
              <span style={{background:"#fef3c7",color:"#d97706",borderRadius:5,padding:"2px 7px",fontSize:10}}>🔄 RPA em breve</span>
              <button onClick={()=>{if(confirm("Excluir?"))setCreds(p=>p.filter(x=>x.id!==c.id));}} style={S.b("#fee2e2","#ef4444","4px 7px")}>🗑</button>
            </div>
          ))}
          {creds.length===0&&<div style={{textAlign:"center",color:"#94a3b8",padding:32}}>Nenhum banco cadastrado.</div>}
        </div>
      </div>}

      {/* MODAL NOVO CONTATO */}
      {showNC&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000}}>
        <div style={{background:"white",borderRadius:14,padding:20,width:400,maxWidth:"90vw",maxHeight:"85vh",overflowY:"auto"}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:13}}>➕ Novo Contato</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {[["Nome *","name","text"],["Telefone/WA *","phone","text"],["CPF","cpf","text"],["E-mail","email","email"],["Cidade","city","text"],["Salário (R$)","salary","number"],["Margem (R$)","margin","number"]].map(([label,field,type])=>(
              <div key={field}><span style={S.l}>{label}</span><input type={type} value={cf[field]||""} onChange={e=>setCf(p=>({...p,[field]:e.target.value}))} style={S.i}/></div>
            ))}
            <div><span style={S.l}>Produto</span><select value={cf.product} onChange={e=>setCf(p=>({...p,product:e.target.value}))} style={S.i}>{PRODUCTS.map(x=><option key={x}>{x}</option>)}</select></div>
            <div><span style={S.l}>Origem</span><select value={cf.origin} onChange={e=>setCf(p=>({...p,origin:e.target.value}))} style={S.i}>{ORIGINS.map(x=><option key={x}>{x}</option>)}</select></div>
            <div><span style={S.l}>Consultor</span><select value={cf.consultant} onChange={e=>setCf(p=>({...p,consultant:e.target.value}))} style={S.i}>{CONSULTANTS.map(x=><option key={x}>{x}</option>)}</select></div>
          </div>
          <div style={{display:"flex",gap:7,marginTop:13}}>
            <button onClick={saveC} style={{...S.b("#10b981","#fff","9px 14px"),flex:1}}>💾 Salvar</button>
            <button onClick={()=>setShowNC(false)} style={{...S.b("#f1f5f9","#64748b","9px 14px"),flex:1}}>Cancelar</button>
          </div>
        </div>
      </div>}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
